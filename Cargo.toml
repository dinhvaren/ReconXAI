[workspace]
resolver = "2"
members = ["crates/reconx-security", "crates/reconx-storage", "crates/reconx-ai", "crates/reconx-tools", "crates/reconx-core", "apps/cli", "apps/desktop/src-tauri"]
default-members = ["apps/cli", "crates/reconx-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
url = "2"
keyring = "4.2.0"
zeroize = "1"
sha2 = "0.11.1"
directories = "6"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
reconx-security = { path = "crates/reconx-security" }
reconx-storage = { path = "crates/reconx-storage" }
reconx-ai = { path = "crates/reconx-ai" }
reconx-tools = { path = "crates/reconx-tools" }
reconx-core = { path = "crates/reconx-core" }
