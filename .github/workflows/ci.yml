name: ReconX verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Linux build dependencies in the disposable CI runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - run: npm ci --registry https://registry.npmjs.org
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p reconx -p reconx-desktop --features reconx-desktop/custom-protocol
      - name: Windows native WebView2 integration
        if: runner.os == 'Windows'
        run: node tests/e2e/native.mjs
        env:
          RECONX_DESKTOP_EXE: ${{ github.workspace }}\target\release\reconx-desktop.exe
          RECONX_CLI_EXE: ${{ github.workspace }}\target\release\reconx.exe
      - name: Windows native research inputs
        if: runner.os == 'Windows'
        run: node tests/e2e/inputs.mjs
        env:
          RECONX_DESKTOP_EXE: ${{ github.workspace }}\target\release\reconx-desktop.exe
          RECONX_CLI_EXE: ${{ github.workspace }}\target\release\reconx.exe
      - name: Windows native durable local jobs
        if: runner.os == 'Windows'
        run: node tests/e2e/jobs.mjs
        env:
          RECONX_DESKTOP_EXE: ${{ github.workspace }}\target\release\reconx-desktop.exe
          RECONX_CLI_EXE: ${{ github.workspace }}\target\release\reconx.exe
      - name: Linux Debian bundle
        # Runtime compatibility is unverified until this workflow actually succeeds.
        if: runner.os == 'Linux'
        run: npm run tauri -- build --config ../../packaging/tauri.linux.json
        working-directory: apps/desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reconx-${{ runner.os }}
          path: |
            target/release/reconx.exe
            target/release/reconx-desktop.exe
            target/release/reconx
            target/release/reconx-desktop
            target/release/bundle/deb/*.deb
            artifacts/native-*/results.json
            artifacts/native-*/*.png
            artifacts/inputs-*/results.json
            artifacts/inputs-*/*.png
            artifacts/jobs-*/results.json
            artifacts/jobs-*/events.json
            artifacts/jobs-*/*.png
          if-no-files-found: warn
