openapi: 3.1.1
info:
  title: Owned API YAML fixture
  version: '1'
servers:
  - url: https://api.example.test/api
paths:
  /users/{userId}:
    get:
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      properties:
        friend:
          $ref: '#/components/schemas/User'
